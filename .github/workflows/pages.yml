name: Deploy Research Report to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage report figures into docs/figures
        run: |
          mkdir -p docs/figures
          cp reports/real/figures/georef_sri_overlay.png \
             reports/real/figures/label_efficiency_curve.png \
             reports/real/figures/selective_redone.png \
             reports/real/figures/unet_overlays.png \
             reports/real/figures/unet_reliability.png \
             docs/figures/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
