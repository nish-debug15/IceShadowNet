name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Next.js dashboard static export
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Stage combined _site (docs root + figures + /dashboard) and verify assets
        run: |
          rm -rf _site
          mkdir -p _site/figures _site/dashboard
          cp -r docs/. _site/
          rm -rf _site/screenshots
          cp reports/real/figures/*.png _site/figures/
          cp -r dashboard/out/. _site/dashboard/
          touch _site/.nojekyll

          python3 - <<'PY'
          import os, re, sys
          html_path = "_site/index.html"
          html_txt = open(html_path, encoding="utf-8").read()
          srcs = re.findall(r'<img[^>]+src=["\']([^"\']+)["\']', html_txt)
          missing = []
          for src in srcs:
              rel = src.lstrip("/")
              repo_candidate = os.path.join("reports", "real", rel) if not os.path.exists(os.path.join("docs", rel)) else os.path.join("docs", rel)
              site_candidate = os.path.join("_site", rel)
              if not os.path.isfile(repo_candidate):
                  missing.append(f"{src} (missing source: {repo_candidate})")
              elif not os.path.isfile(site_candidate):
                  missing.append(f"{src} (missing staged: {site_candidate})")
          for required in ["_site/index.html", "_site/dashboard/index.html", "_site/dashboard/segmentation/index.html"]:
              if not os.path.isfile(required):
                  missing.append(f"required page missing: {required}")
          if missing:
              print("STAGING AUDIT FAILED — missing referenced files:")
              for m in missing:
                  print("  -", m)
              sys.exit(1)
          print(f"Staging verified cleanly: {len(srcs)} figures referenced by docs/index.html present in _site/figures/ + /dashboard/ staged.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
