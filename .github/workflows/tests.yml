name: CI Pipeline Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: "pip"
    - name: Install CPU PyTorch
      run: |
        python -m pip install --upgrade pip
        pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
    - name: Install requirements and pytest
      run: |
        pip install -r requirements.txt pytest
    - name: Run pytest
      run: |
        python -m pytest tests -v
    - name: Check repo images hygiene
      run: |
        python scripts/check_repo_images.py
