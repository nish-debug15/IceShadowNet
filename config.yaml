# IceShadowNet configuration
# All scripts read from this file via PyYAML.

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  patch_size: 256
  stride: 128
  dfsar_channels: 2       # HH, HV polarisations
  ohrc_channels: 1        # single greyscale band

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  grid_size: [8, 8]       # spatial block grid (rows x cols)
  seed: 42

training:
  batch_size: 16
  learning_rate: 0.001
  epochs: 30
  focal_loss_gamma: 2.0   # used when imbalance ratio > 10
  focal_loss_alpha: 0.25
  device: "cpu"           # override to "cuda" if GPU is available

paths:
  models_dir: "models"
  reports_dir: "reports"
  gradcam_dir: "reports/gradcam"

# Real Chandrayaan-2 DFSAR L1A configuration
real_dfsar:
  raw_dir: "data/raw/sar_nxcl"
  processed_dir: "data/processed_real"
  reports_dir: "reports/real"
  models_dir: "models_real"
  patch_size: 64          # Spatial patch size (HxW) to fit within 116-pixel swath
  stride: 32              # Sliding window stride along and across track
  grid_size: [1, 20]      # Spatial block split grid (y_bins, x_bins) along-track
  multilook_window: 7     # Boxcar averaging window for complex polarimetry
  cpr_threshold: 1.0      # CPR > 1.0 threshold for anomalous volume scattering
  dop_threshold: 0.13     # DOP < 0.13 threshold for depolarized return
  min_positive_pixels: 5  # Minimum CPR>1 & DOP<0.13 pixels in patch for positive label (y=1)
  patch_label_fraction: 0.0012 # Equivalent to >= 5 pixels in 64x64 patch (~0.12%)
  input_channels: ["hh", "hv", "vv"] # Raw radar log-intensities only (no derived CPR/DOP)

